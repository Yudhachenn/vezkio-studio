[package]
name = "vezkio"
version = "1.2.0"
description = "VEZKIO Studio - Offline-first creative design editor"
authors = ["VEZKIO Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vezkio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
